spring.application.name=georural
server.port=8080

# Caminho para o .env
spring.config.import=optional:file:./.env[.properties]


# ---------- Banco: Oracle Autonomous via carteira ----------
spring.datasource.url=jdbc:oracle:thin:@${TNS_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${WALLET_DIR}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


# recusa ALTER SESSION de PARALLEL DML com transacao aberta (ORA-12841).
spring.datasource.hikari.connection-init-sql=ALTER SESSION DISABLE PARALLEL DML


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-timeout=30000


# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Marco zero, decisao 1: todo instante trafega e e gravado em UTC. Sem esta
# linha o Hibernate converte TIMESTAMP usando o fuso da JVM, e foi assim que
# a auditoria do projeto anterior nasceu tres horas adiantada.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ---------- Serializacao ----------
# A API publica instante em ISO-8601 com Z. A conversao para America/Sao_Paulo
# acontece em um lugar so: a formatacao no front.
spring.jackson.time-zone=UTC


# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=GEORURAL
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false


# ---------- Upload ----------
# Limite alto de proposito: carga estadual de CAR ou embargo pode ser grande e
# nao deve ser barrada. Acima do limiar o multipart vai para disco, nao heap.
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.servlet.multipart.file-size-threshold=10MB

# ---------- Keycloak ----------
# O emissor e fixo. Quem garante isso e o KC_HOSTNAME em infra/docker-compose.yml:
# sem ele o Keycloak monta o iss a partir do endereco pelo qual o token foi
# pedido, e um cliente que chega por outro nome leva 401.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=georural-api


# ---------- Data lake: OCI Object Storage ----------
georural.lake.region=sa-saopaulo-1
georural.lake.namespace=grcfu9trlodp
georural.lake.bucket.bruta=georural-bruta
georural.lake.bucket.quarentena=georural-quarentena
georural.lake.bucket.tratada=georural-tratada
georural.lake.bucket.publicada=georural-publicada
georural.lake.oci-config-file=${user.home}/.oci/config
georural.lake.oci-profile=GEORURAL_APP


# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.diskspace.enabled=true

# ---------- Log ----------
# Injeta o codigo de correlacao no padrao do Spring sem trocar o formato
# inteiro: o campo do nivel passa a carregar [codigo]. Sai vazio nas linhas
# de inicializacao, que nao pertencem a nenhuma requisicao.
logging.pattern.level=%5p [%X{correlacao:-}]